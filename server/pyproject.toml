[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-agent-pipeline"
version = "0.1.0"
description = "Backend dependencies for the AI coding agent pipeline."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.156.3",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    # These additions are not version-verified yet; pin them after a first install.
    "uvicorn[standard]",
    "gunicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "langgraph-checkpoint-postgres",
    "openai",
    "fastapi-users[sqlalchemy]",
    "cryptography",
    "pydantic-settings",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
