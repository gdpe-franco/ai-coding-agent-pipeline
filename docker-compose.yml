services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Development convenience; production must not publish the database port.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 20s
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data

  browser:
    image: mcr.microsoft.com/playwright:v1.55.1-noble
    profiles: [e2e]
    network_mode: host
    working_dir: /work
    command: ["sh", "-lc", "npm ci && npm run test:e2e"]
    environment:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    volumes:
      - ./client:/work
    depends_on:
      app:
        condition: service_healthy

  plantuml:
    image: plantuml/plantuml-server:jetty
    profiles: [docs]
    ports:
      - "8080:8080"

volumes:
  pgdata:
  appdata:
